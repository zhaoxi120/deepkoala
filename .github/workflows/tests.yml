name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / ${{ matrix.os }} / Python ${{ matrix.python-version }} / torch ${{ matrix.torch-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            torch-version: '2.4.1'
          - os: windows-latest
            python-version: '3.11'
            torch-version: '2.4.1'
          - os: macos-latest
            python-version: '3.11'
            torch-version: '2.4.1'
          - os: ubuntu-latest
            python-version: '3.12'
            torch-version: latest
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      # These Node 24 actions require Actions Runner >= 2.327.1.
      # Use current GitHub-hosted runners; no self-hosted runner is assumed.
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Cone-mode sparse checkout also includes root configuration files.
          # CI generates tiny checkpoints; production resources and local
          # benchmark inputs/results are not needed here.
          sparse-checkout: |
            .github
            deepkoala
            tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install "torch${{ matrix.torch-version == 'latest' && '>=2.4.1,<3' || '==2.4.1' }}" --index-url https://download.pytorch.org/whl/cpu

      - name: Install baseline PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.4.1

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run lightweight CPU compatibility checks
        # No real GPU/HMMER or throughput/memory benchmarks in GitHub Actions.
        run: python -m pytest tests -m "not hardware and not hmmer and not benchmark" --junitxml=test-results/junit.xml

      - name: Upload small compatibility report only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch-version }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
