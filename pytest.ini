[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra
xfail_strict = true
markers =
    benchmark: local-only performance or memory measurement; excluded from GitHub CI
    hardware: requires a real CUDA or MPS device; opt in with --run-hardware
    hmmer: requires real HMMER executables; opt in with --run-hmmer
    integration: exercises multiple components or a subprocess
    known_issue: documents an existing defect with a strict expected failure
